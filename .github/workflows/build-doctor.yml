name: Build doctor

# Temporary helper: compiles the Rust crate and reports the full compiler output
# as a commit comment so the failure can be inspected without log downloads.
on:
  push:
    branches: ["arena/**"]
  workflow_dispatch:

jobs:
  doctor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: cargo build --release
        run: |
          set -o pipefail
          cargo build --release 2>&1 | tail -c 60000 | tee /tmp/build.log
        continue-on-error: true
      - name: cargo clippy
        run: |
          cargo clippy --all-targets 2>&1 | tail -c 40000 | tee /tmp/clippy.log
        continue-on-error: true
      - name: cargo fmt
        run: |
          cargo fmt --all -- --check 2>&1 | tail -c 20000 | tee /tmp/fmt.log
        continue-on-error: true
      - name: Annotate errors
        if: always()
        shell: bash
        run: |
          python3 - <<'PY' > /tmp/annot.txt
          import urllib.parse
          for name in ("build", "clippy"):
              try:
                  text = open(f"/tmp/{name}.log", encoding="utf-8", errors="replace").read()
              except FileNotFoundError:
                  continue
              lines = [l for l in text.splitlines() if l.strip()]
              # keep error blocks and the tail of the log
              keep = [l for l in lines if l.startswith(("error", "warning:")) or "--> " in l][:60]
              body = "\n".join(keep) or "\n".join(lines[-40:])
              body = body[:6000]
              print(f"::error title={name} log::{urllib.parse.quote(body, safe='')}")
          PY
          cat /tmp/annot.txt
