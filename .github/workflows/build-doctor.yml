name: Build doctor

# Temporary helper: compiles the Rust crate and reports the full compiler output
# as a commit comment so the failure can be inspected without log downloads.
on:
  push:
    branches: ["arena/**"]
  workflow_dispatch:

jobs:
  doctor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: cargo build --release
        run: |
          set -o pipefail
          cargo build --release 2>&1 | tail -c 60000 | tee /tmp/build.log
        continue-on-error: true
      - name: cargo clippy
        run: |
          cargo clippy --all-targets 2>&1 | tail -c 40000 | tee /tmp/clippy.log
        continue-on-error: true
      - name: cargo fmt
        run: |
          cargo fmt --all -- --check 2>&1 | tail -c 20000 | tee /tmp/fmt.log
        continue-on-error: true
      - name: Report
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ github.sha }}
          BRANCH: ${{ github.ref_name }}
        run: |
          {
            echo "## Build doctor"
            for f in build clippy fmt; do
              echo ""
              echo "### $f"
              echo '```'
              tail -c 45000 /tmp/$f.log 2>/dev/null || echo "(no output)"
              echo '```'
            done
          } > /tmp/report.md
          head -c 1000000 /tmp/report.md >> "$GITHUB_STEP_SUMMARY"
          base64 -w0 /tmp/report.md > /tmp/report.b64
          gh api "repos/$GITHUB_REPOSITORY/contents/ci-report.md" -X PUT \
            -f message="ci: build doctor report" \
            -f branch="$BRANCH" \
            -f content=@/tmp/report.b64 || echo "contents upload unavailable"
