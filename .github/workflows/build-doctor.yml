name: Build doctor

# Temporary helper: compiles the Rust crate and reports the full compiler output
# as a commit comment so the failure can be inspected without log downloads.
on:
  push:
    branches: ["arena/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  doctor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: cargo build --release
        run: |
          set -o pipefail
          cargo build --release 2>&1 | tail -c 60000 | tee /tmp/build.log
        continue-on-error: true
      - name: cargo clippy
        run: |
          cargo clippy --all-targets 2>&1 | tail -c 40000 | tee /tmp/clippy.log
        continue-on-error: true
      - name: cargo fmt
        run: |
          cargo fmt --all -- --check 2>&1 | tail -c 20000 | tee /tmp/fmt.log
        continue-on-error: true
      - name: Annotate errors
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import re, urllib.parse
          ANSI = re.compile(r"\x1b\[[0-9;]*[A-Za-z]")
          for name in ("build", "clippy"):
              try:
                  text = open(f"/tmp/{name}.log", encoding="utf-8", errors="replace").read()
              except FileNotFoundError:
                  continue
              text = ANSI.sub("", text)
              lines = text.splitlines()
              starts = [i for i, l in enumerate(lines) if l.startswith("error")]
              if starts:
                  first = starts[0]
                  block = lines[first:first + 30]
              else:
                  block = lines[-30:]
              body = "\n".join(block)[:5000]
              print(f"::error title={name}::{urllib.parse.quote(body, safe='')}")
          PY
      - name: Probe token permissions
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set +e
          {
            echo "repo perms: $(gh api "repos/$GITHUB_REPOSITORY" --jq '.permissions' 2>&1 | head -c 300)"
            echo "put:"
            gh api "repos/$GITHUB_REPOSITORY/contents/ci-probe.txt" -X PUT \
              -f message="ci: probe" -f content=aGk= -f branch="$BRANCH" --include 2>&1 | head -20
          } > /tmp/probe.txt
          cat /tmp/probe.txt
          python3 -c "import urllib.parse;print('::error title=probe::'+urllib.parse.quote(open('/tmp/probe.txt').read(),safe=''))"
